[project]
name = "s2s-downscaling"
version = "0.1.0"
dependencies = [
    "cartopy>=0.25.0",
    "cfgrib>=0.9.15.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "jax>=0.10.1",
    "matplotlib>=3.10.9",
    "netcdf4>=1.7.4",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "xarray>=2026.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["E731", "F722"]
